# Publish docs/wiki/*.md to the GitHub wiki when they change on master. The wiki is a copy: edit the pages in
# docs/wiki/ of the repository (pull request), not on the wiki, where the changes would be overwritten.
# Pages that exist only on the wiki are kept.
name: wiki

on:
  push:
    branches: [master]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy docs/wiki to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          cp docs/wiki/*.md wiki/
          cat > wiki/_Footer.md <<FOOTER
          These pages are generated from [docs/wiki/](https://github.com/${GITHUB_REPOSITORY}/tree/master/docs/wiki) of the repository: edit them there (pull request), changes made on the wiki are overwritten.
          FOOTER
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then echo "wiki already up to date"; exit 0; fi
          git commit -m "Update from docs/wiki at ${GITHUB_SHA::7}"
          git push
